<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Prop Firm Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen p-6 font-sans">

<div class="max-w-6xl mx-auto space-y-6">

  <div>
    <h1 class="text-4xl font-bold">Interactive Prop Firm Dashboard</h1>
    <p class="text-zinc-400">Edit values live to simulate your scaling plan</p>
  </div>

  <!-- ALPHA -->
  <div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800">
    <h2 class="text-2xl font-bold mb-4">Alpha Futures</h2>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div>
        <label class="text-zinc-400">Pending Payout ($)</label>
        <input id="alphaPayout" type="number" value="360" class="w-full mt-1 p-2 bg-black border border-zinc-700 rounded-xl" />
      </div>

      <div>
        <label class="text-zinc-400">Winning Days Needed</label>
        <input id="alphaDays" type="number" value="1" class="w-full mt-1 p-2 bg-black border border-zinc-700 rounded-xl" />
      </div>
    </div>
  </div>

  <!-- RAPIDS -->
  <div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800">
    <h2 class="text-2xl font-bold mb-4">FundedNext Rapids</h2>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

      <div>
        <label class="text-zinc-400">Number of Accounts</label>
        <input id="rapidAccounts" type="number" value="3" class="w-full mt-1 p-2 bg-black border border-zinc-700 rounded-xl" />
      </div>

      <div>
        <label class="text-zinc-400">Payout per Account ($)</label>
        <input id="rapidPayout" type="number" value="800" class="w-full mt-1 p-2 bg-black border border-zinc-700 rounded-xl" />
      </div>

      <div>
        <label class="text-zinc-400">Take-home %</label>
        <input id="rapidPercent" type="number" value="80" class="w-full mt-1 p-2 bg-black border border-zinc-700 rounded-xl" />
      </div>

    </div>

    <div class="mt-4 text-green-400 text-lg">
      Total Take Home: $<span id="rapidTotal">0</span>
    </div>
  </div>

  <!-- APEX -->
  <div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800">
    <h2 class="text-2xl font-bold mb-4">Apex EOD Scaling</h2>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

      <div>
        <label class="text-zinc-400">Accounts</label>
        <input id="apexAccounts" type="number" value="10" class="w-full mt-1 p-2 bg-black border border-zinc-700 rounded-xl" />
      </div>

      <div>
        <label class="text-zinc-400">Payout per Account ($)</label>
        <input id="apexPayout" type="number" value="1500" class="w-full mt-1 p-2 bg-black border border-zinc-700 rounded-xl" />
      </div>

      <div>
        <label class="text-zinc-400">Qualifying Days</label>
        <input id="apexDays" type="number" value="5" class="w-full mt-1 p-2 bg-black border border-zinc-700 rounded-xl" />
      </div>

    </div>

    <div class="mt-4 text-green-400 text-lg">
      Total Potential Payout: $<span id="apexTotal">0</span>
    </div>
  </div>

  <!-- OUTPUT SUMMARY -->
  <div class="bg-zinc-900 p-6 rounded-3xl border border-zinc-800">
    <h2 class="text-2xl font-bold mb-4">Summary</h2>
    <div class="text-lg space-y-2">
      <div>Alpha Stage Ready: <span id="alphaStatus" class="text-yellow-400">Pending</span></div>
      <div>Rapid Scale Potential: <span class="text-green-400" id="rapidSummary">-</span></div>
      <div>Apex Scale Potential: <span class="text-blue-400" id="apexSummary">-</span></div>
    </div>
  </div>

</div>

<script>

function update() {
  const rapidAccounts = Number(document.getElementById('rapidAccounts').value);
  const rapidPayout = Number(document.getElementById('rapidPayout').value);
  const rapidPercent = Number(document.getElementById('rapidPercent').value);

  const apexAccounts = Number(document.getElementById('apexAccounts').value);
  const apexPayout = Number(document.getElementById('apexPayout').value);
  const apexDays = Number(document.getElementById('apexDays').value);

  const rapidTotal = rapidAccounts * rapidPayout * (rapidPercent / 100);
  const apexTotal = apexAccounts * apexPayout;

  document.getElementById('rapidTotal').innerText = rapidTotal.toFixed(0);
  document.getElementById('apexTotal').innerText = apexTotal.toFixed(0);

  document.getElementById('rapidSummary').innerText =
    `$${rapidTotal.toFixed(0)} per cycle`;

  document.getElementById('apexSummary').innerText =
    `$${apexTotal.toFixed(0)} per payout cycle`;

  const alphaPayout = Number(document.getElementById('alphaPayout').value);

  document.getElementById('alphaStatus').innerText =
    alphaPayout > 0 ? "Ready to scale" : "Pending";
}

// attach listeners
const inputs = document.querySelectorAll('input');
inputs.forEach(i => i.addEventListener('input', update));

update();
</script>

</body>
</html>
